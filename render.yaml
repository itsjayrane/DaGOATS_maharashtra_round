# Render Blueprint: deploys the FastAPI backend (/server). Frontend goes to Vercel (see docs/deploy.md).
services:
  - type: web
    name: relearn-api
    runtime: python
    plan: free
    # Build = install the pinned deps only. The serving model (ml/artifacts/diagnoser.joblib + threshold.json) is committed,
    # trained with exactly these pins; the server checks every required file at startup and refuses to start, with a clear
    # message, if one is missing. `python -m app.artifacts` (from server/) runs the same check.
    buildCommand: pip install --upgrade pip && pip install -r server/requirements.txt && cd server && python -m app.artifacts
    startCommand: cd server && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: RELEARN_DB            # SQLite on ephemeral disk: learner history resets on each deploy/restart (free plan)
        value: /tmp/relearn.db
      - key: CORS_ORIGINS          # extra allowed origins, comma-separated (any *.vercel.app is already allowed)
        sync: false
      - key: INSIGHTS_SALT         # salt for hashing learner ids on the Insights page / CSV export (set any long random string)
        generateValue: true
